<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samrat Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
<h2>Samrat Chat</h2>
<input type="text" id="username" placeholder="Enter your name">
<input type="file" id="profileInput" accept="image/*" hidden>
<button id="profileBtn" type="button">👤 Profile Picture</button>
<button id="loginBtn">Join Chat</button>
</div>
<div id="chat" style="display:none;">
<div id="chatHeader">
  <div id="chatTitle">Samrat Chat</div>
  <div id="menuBtn">⋮</div>
</div>

<div id="menuBox">
  <div>👤 Profile</div>
  <div>🌙 Dark Mode</div>
  <div>🔔 Notifications</div>
  <div>🔒 Privacy</div>
  <div>⚙ Settings</div>
  <div>ℹ About</div>
  <div id="menuLogout">🚪 Logout</div>
</div>


<select id="userList">
  <option value="">🌍 Everyone</option>
</select>

<div id="typing" style="color:gray;font-style:italic;margin:5px 0;"></div>

<ul id="messages"></ul>
<input type="file" id="imageInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>
<button id="sendVideoBtn" type="button" style="display:none;">Send Video</button>
<div id="previewBox">
  <img id="imagePreview">
</div>
<button id="sendImageBtn" type="button" style="display:none;">Send Photo</button>
<form id="form">
<button id="voiceBtn" type="button">🎤</button>
<button id="photoBtn" type="button">📷</button>
<button id="videoBtn" type="button">🎥</button>
<input
id="input"
type="text"
placeholder="Type message..."
autocomplete="off"
>
<button type="submit">➤</button>
</form>

</div><script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
